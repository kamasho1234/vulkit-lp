<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>チャット履歴 | VULKIT VBP101</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --blue: #2563eb;
        --blue-dark: #1e40af;
        --paper: #ffffff;
        --bg: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, .12), transparent 32rem),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 34px 0 46px;
      }

      .hero,
      .panel,
      .summary article {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 18px 56px rgba(17, 24, 39, .08);
      }

      .hero {
        display: grid;
        gap: 16px;
        padding: 26px;
        border-radius: 20px;
      }

      .eyebrow {
        margin: 0;
        color: var(--blue-dark);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .2em;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 46px);
        letter-spacing: .03em;
      }

      .lead,
      .status {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      input,
      button {
        min-height: 44px;
        border-radius: 999px;
        font: inherit;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        padding: 0 16px;
        background: #fff;
      }

      button {
        border: 0;
        padding: 0 18px;
        cursor: pointer;
        background: linear-gradient(135deg, var(--blue), #38bdf8);
        color: #fff;
        font-weight: 800;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 18px 0;
      }

      .summary article {
        padding: 18px;
        border-radius: 16px;
      }

      .summary span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .summary strong {
        display: block;
        margin-top: 6px;
        color: var(--blue-dark);
        font-size: 34px;
      }

      .panel {
        overflow: hidden;
        border-radius: 20px;
      }

      .panel-head {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        margin: 0;
        font-size: 20px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 1080px;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f8fafc;
        color: #475569;
        font-size: 12px;
        letter-spacing: .08em;
        white-space: nowrap;
      }

      tbody tr:hover {
        background: #f8fbff;
      }

      .question {
        min-width: 190px;
        font-weight: 800;
      }

      .answer {
        min-width: 280px;
        color: #374151;
        line-height: 1.65;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: 999px;
        background: #eff6ff;
        color: var(--blue-dark);
        font-size: 12px;
        font-weight: 800;
      }

      .empty {
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 18px, 1180px);
          padding-top: 18px;
        }

        .hero {
          padding: 20px;
        }

        .controls,
        .summary {
          grid-template-columns: 1fr;
        }

        .panel-head {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">VULKIT CHAT LOGS</p>
        <h1>チャット履歴</h1>
        <p class="lead">LP内チャットボットに入力された質問と、自動返信した内容を確認できます。広告・LP改善で「どこで不安が残っているか」を見るための管理画面です。</p>
        <div class="controls">
          <input id="search" type="search" placeholder="質問・回答・広告名・LPで検索">
          <button id="reload" type="button">更新</button>
        </div>
      </section>

      <section class="summary" aria-label="集計">
        <article>
          <span>表示中の質問数</span>
          <strong id="visibleCount">0</strong>
        </article>
        <article>
          <span>セッション数</span>
          <strong id="sessionCount">0</strong>
        </article>
        <article>
          <span>最終更新</span>
          <strong id="updatedAt">-</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>質問一覧</h2>
          <p class="status" id="status">読み込み中です。</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時刻</th>
                <th>質問</th>
                <th>回答カテゴリ</th>
                <th>回答内容</th>
                <th>LP</th>
                <th>流入</th>
                <th>広告情報</th>
                <th>ページ</th>
                <th>端末</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="empty" id="empty" hidden>該当するチャット履歴はありません。</p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const adminKey = params.get("key") || "";
      const rowsEl = document.getElementById("rows");
      const emptyEl = document.getElementById("empty");
      const statusEl = document.getElementById("status");
      const searchEl = document.getElementById("search");
      const visibleCountEl = document.getElementById("visibleCount");
      const sessionCountEl = document.getElementById("sessionCount");
      const updatedAtEl = document.getElementById("updatedAt");
      let allRows = [];

      function esc(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function formatDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("ja-JP", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function compactSource(row) {
        return [row.utm_source, row.utm_medium, row.utm_campaign].filter(Boolean).join(" / ") || "-";
      }

      function compactAd(row) {
        return [row.utm_content, row.adset, row.ad].filter(Boolean).join(" / ") || "-";
      }

      function render() {
        const query = searchEl.value.trim().toLowerCase();
        const rows = allRows.filter((row) => !query || JSON.stringify(row).toLowerCase().includes(query));
        rowsEl.innerHTML = rows.map((row) => `
          <tr>
            <td>${esc(formatDate(row.occurred_at))}</td>
            <td class="question">${esc(row.question)}</td>
            <td><span class="tag">${esc(row.answer_title || "-")}</span></td>
            <td class="answer">${esc(row.answer_text)}</td>
            <td>${esc(row.lp_variant || "-")}</td>
            <td>${esc(compactSource(row))}</td>
            <td>${esc(compactAd(row))}</td>
            <td>${esc(row.page_path || "-")}</td>
            <td>${esc(row.device || "-")}</td>
          </tr>
        `).join("");
        emptyEl.hidden = rows.length > 0;
        visibleCountEl.textContent = String(rows.length);
        sessionCountEl.textContent = String(new Set(rows.map((row) => row.chat_session_id).filter(Boolean)).size);
      }

      async function loadLogs() {
        if (!adminKey) {
          statusEl.textContent = "URLに管理キーがありません。?key=... を付けて開いてください。";
          return;
        }
        statusEl.textContent = "読み込み中です。";
        try {
          const response = await fetch(`/api/chatbot-logs?limit=500&key=${encodeURIComponent(adminKey)}`);
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "読み込みに失敗しました。");
          allRows = data.rows || [];
          updatedAtEl.textContent = formatDate(data.updated_at);
          statusEl.textContent = `${allRows.length}件の履歴を読み込みました。`;
          render();
        } catch (error) {
          statusEl.textContent = error.message || "読み込みに失敗しました。";
          allRows = [];
          render();
        }
      }

      searchEl.addEventListener("input", render);
      document.getElementById("reload").addEventListener("click", loadLogs);
      loadLogs();
    </script>
  </body>
</html>
